name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.1.0'

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Godot and export templates
        run: |
          mkdir -p "$HOME/.local/bin" "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          curl -fsSL -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d "$HOME/.local/bin"
          mv "$HOME/.local/bin/Godot_v4.7.2-stable_linux.x86_64" "$HOME/.local/bin/godot"
          chmod +x "$HOME/.local/bin/godot"
          curl -fsSL -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p /tmp/templates
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -a /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure signing key
        run: |
          mkdir -p "$HOME/.local/share/godot/keystores"
          KEYSTORE="$HOME/.local/share/godot/keystores/debug.keystore"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=Android Debug,O=Android,C=US'
          # Copia tambem para o caminho default que o Godot procura
          mkdir -p "$HOME/.android"
          cp "$KEYSTORE" "$HOME/.android/debug.keystore"
          mkdir -p "$HOME/.config/godot"
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '' \
            '[resource]' \
            "export/android/android_sdk_path = \"$ANDROID_HOME\"" \
            "export/android/java_sdk_path = \"$JAVA_HOME\"" \
            "export/android/debug_keystore = \"$KEYSTORE\"" \
            'export/android/debug_keystore_user = "androiddebugkey"' \
            'export/android/debug_keystore_pass = "android"' \
            > "$HOME/.config/godot/editor_settings-4.7.tres"
          ls -la "$KEYSTORE" "$HOME/.android/debug.keystore"

      - name: Install Godot Android build template into project
        working-directory: game
        run: |
          godot --headless --editor --quit-after 120 --install-android-build-template || true
          if [ ! -d android/build ]; then
            mkdir -p android
            unzip -q "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_source.zip" -d android/build
          fi

      - name: Export APK
        working-directory: game
        run: |
          KEYSTORE="$HOME/.local/share/godot/keystores/debug.keystore"
          # Corrige caminhos hardcoded de keystore no export_presets.cfg
          sed -i "s|keystore/debug=.*|keystore/debug=\"$KEYSTORE\"|" export_presets.cfg
          sed -i 's|keystore/debug_user=.*|keystore/debug_user="androiddebugkey"|' export_presets.cfg
          sed -i 's|keystore/debug_password=.*|keystore/debug_password="android"|' export_presets.cfg
          sed -i "s|keystore/release=.*|keystore/release=\"$KEYSTORE\"|" export_presets.cfg
          sed -i 's|keystore/release_user=.*|keystore/release_user="androiddebugkey"|' export_presets.cfg
          sed -i 's|keystore/release_password=.*|keystore/release_password="android"|' export_presets.cfg
          grep keystore export_presets.cfg || true
          mkdir -p dist
          godot --headless --path . --export-debug "Android" dist/Andre3D-2.1.21-debug.apk

      - name: Verify APK
        working-directory: game
        run: |
          test -s dist/Andre3D-2.1.21-debug.apk
          sha256sum dist/Andre3D-2.1.21-debug.apk
          ls -lh dist/Andre3D-2.1.21-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Andre3D-2.1.21-debug
          path: game/dist/Andre3D-2.1.21-debug.apk
          if-no-files-found: error
