name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python for map tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install map-test dependency
        run: python -m pip install Pillow==13.0.0

      - name: Run map and boundary contract tests
        working-directory: game
        run: python -m unittest tests.test_gta3_map_assets tests.test_map_boundary_protection -v

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.1.0'

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Godot and export templates
        run: |
          mkdir -p "$HOME/.local/bin" "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          curl --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 30 --max-time 1800 -fsSL -o "$HOME/.local/bin/godot" https://files.manuscdn.com/user_upload_by_module/session_file/310519664071928669/OfxbuTEbbEHoFudu.x86_64
          chmod +x "$HOME/.local/bin/godot"
          curl --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 30 --max-time 1800 -fsSL -o "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk" https://files.manuscdn.com/user_upload_by_module/session_file/310519664071928669/GowBqSRiMNZyNdMJ.apk
          curl --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 30 --max-time 1800 -fsSL -o "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_release.apk" https://files.manuscdn.com/user_upload_by_module/session_file/310519664071928669/ixGNZbIvhvkTiBPZ.apk
          curl --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 30 --max-time 1800 -fsSL -o /tmp/android_source.zip https://files.manuscdn.com/user_upload_by_module/session_file/310519664071928669/MiUDXVwcgiCiOGQw.zip
          mkdir -p game/android/build
          unzip -q /tmp/android_source.zip -d game/android/build
          touch game/android/build/.gdignore
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure signing key
        run: |
          mkdir -p "$HOME/.local/share/godot/keystores"
          KEYSTORE="$HOME/.local/share/godot/keystores/debug.keystore"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=Android Debug,O=Android,C=US'
          printf 'KEYSTORE_PATH=%s\n' "$KEYSTORE" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.config/godot"
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '' \
            '[resource]' \
            "export/android/android_sdk_path = \"$ANDROID_HOME\"" \
            "export/android/java_sdk_path = \"$JAVA_HOME\"" \
            > "$HOME/.config/godot/editor_settings-4.7.tres"
          keytool -list -keystore "$KEYSTORE" -storepass android -alias androiddebugkey >/dev/null

      - name: Install Godot Android build template into project
        working-directory: game
        run: |
          godot --headless --editor --quit-after 120 --install-android-build-template || true
          if [ ! -d android/build ]; then
            mkdir -p android
            unzip -q "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_source.zip" -d android/build
          fi
          # Keep Godot from importing the Android Gradle template as game assets.
          touch android/build/.gdignore
          find android/build -type f -name '*.import' -delete
          # Use the session CDN mirror because services.gradle.org intermittently returns 504.
          sed -i 's|^distributionUrl=.*|distributionUrl=https\\://files.manuscdn.com/user_upload_by_module/session_file/310519664071928669/RpSxmQxhibnnsKUT.zip|' android/build/gradle/wrapper/gradle-wrapper.properties

      - name: Validate center map tile selection and spawn
        working-directory: game
        run: godot --headless --path . --script res://test/check_map_region_isolation.gd

      - name: Read app version
        id: app_version
        working-directory: game
        run: |
          version="$(sed -n 's/^config\/version="\([^"]*\)"/\1/p' project.godot | head -n 1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Export APK
        working-directory: game
        env:
          APP_VERSION: ${{ steps.app_version.outputs.version }}
        run: |
          sed -i "s|keystore/debug=.*|keystore/debug=\"$KEYSTORE_PATH\"|" export_presets.cfg
          sed -i 's|keystore/debug_user=.*|keystore/debug_user="androiddebugkey"|' export_presets.cfg
          sed -i 's|keystore/debug_password=.*|keystore/debug_password="android"|' export_presets.cfg
          sed -i "s|keystore/release=.*|keystore/release=\"$KEYSTORE_PATH\"|" export_presets.cfg
          sed -i 's|keystore/release_user=.*|keystore/release_user="androiddebugkey"|' export_presets.cfg
          sed -i 's|keystore/release_password=.*|keystore/release_password="android"|' export_presets.cfg
          mkdir -p dist
          godot --headless --path . --export-debug "Android" "dist/Andre3D-${APP_VERSION}-debug.apk"

      - name: Verify APK
        working-directory: game
        env:
          APP_VERSION: ${{ steps.app_version.outputs.version }}
        run: |
          test -s "dist/Andre3D-${APP_VERSION}-debug.apk"
          sha256sum "dist/Andre3D-${APP_VERSION}-debug.apk"
          ls -lh "dist/Andre3D-${APP_VERSION}-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Andre3D-${{ steps.app_version.outputs.version }}-debug
          path: game/dist/Andre3D-${{ steps.app_version.outputs.version }}-debug.apk
          if-no-files-found: error
